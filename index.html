<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTree — GAAP P&L Explorer</title>
  <meta name="description" content="Interactive explorer for the FinTree US GAAP P&L ontology — 234 line items with XBRL tags, formulas, variance drivers, and chart-of-accounts mappings. Waterfall, hierarchy, and statement views.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="ft-root"></div>
  <!-- Screen-reader live region: lives OUTSIDE #app so it survives the app's
       full innerHTML re-renders and can announce detail-panel changes. -->
  <div id="ftLive" class="ft-sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- GSAP (self-hosted, v3.12.5) powers the enter animations; the app degrades gracefully without it. -->
  <script src="vendor/gsap.min.js"></script>
  <!-- Canonical 234-node dataset (generated by compile_tree.py). Single source of truth.
       charset="utf-8" pins the decode for these external scripts (both contain em-dashes /
       minus signs) so they render correctly even when a host serves .js without a charset. -->
  <script src="tree-data.js?v=3" charset="utf-8"></script>
  <script src="app.js?v=3" charset="utf-8"></script>
</body>
</html>
