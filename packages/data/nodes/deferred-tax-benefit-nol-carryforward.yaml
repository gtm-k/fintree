classification_notes: 'Under TCJA, post-2017 NOLs have no expiration but can only offset 80% of taxable income in any year. Pre-2017 NOLs had 20-year expiration. IRC Section 382 limits NOL usage after ownership changes (>50% in 3 years). A valuation allowance is required when it is more likely than not that some or all of the DTA will not be realized. Releasing a valuation allowance (when the company becomes consistently profitable) creates a large one-time deferred tax benefit. This is a key metric for early-stage companies transitioning to profitability.'
variance_drivers:
  tags: [profitability_trajectory, valuation_allowance_assessment, section_382_limits, nol_expiration]
  playbook:
    if_increased: '(1) company achieves sustained profitability, releasing valuation allowance, (2) new losses generating additional NOL carryforwards, (3) tax rate increase raising the value of existing NOLs, (4) favorable Section 382 analysis confirming no ownership change limitation'
    if_decreased: '(1) utilization of NOLs against current taxable income, (2) establishment of valuation allowance against uncertain future realization, (3) Section 382 limitation triggered by ownership change, (4) tax rate decrease reducing the value of NOLs, (5) expiration of pre-2017 NOLs'
comparability:
  variations: 'Companies with long histories of losses (early-stage tech, biotech, airlines post-crisis) have large NOL DTAs. The valuation allowance is a key judgment — its release or establishment signals management''s confidence in future profitability. Investors closely watch this for turnaround companies.'
  examples:
    - company: 'Uber'
      treatment: 'Massive NOL DTA ($5B+) — partially offset by valuation allowance; released as profitability improved'
    - company: 'Tesla'
      treatment: 'Released valuation allowance in 2020 as sustained profitability was established — large one-time tax benefit'
    - company: 'Moderna'
      treatment: 'Pre-COVID NOLs fully utilized during vaccine profitability surge — DTA drawn down rapidly'
