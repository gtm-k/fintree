classification_notes: "Grants and sponsored research payments to universities are expensed as incurred if the company bears the research risk. If the arrangement grants the company IP rights, analyze whether it is a funded R&D arrangement under ASC 730-20. Charitable research donations may be classified as G&A rather than R&D. Joint research ventures may require equity method or consolidation analysis."
variance_drivers:
  tags: [strategic, discretionary, long_term, partnership_driven]
  playbook:
    if_increased: "(1) new academic research partnerships established, (2) expanded funding for existing collaborations, (3) strategic pivot requiring fundamental research capabilities, (4) industry consortium participation"
    if_decreased: "(1) partnership completions or expirations, (2) budget cuts reducing discretionary research spending, (3) shift to in-house research capabilities, (4) strategic reprioritization away from basic research"
comparability:
  variations: "Large tech and pharma companies are the heaviest funders of university research. Some arrangements include student placement programs. IP ownership terms vary -- some companies retain full rights, others share with the university. Government-funded joint programs may offset company costs."
  examples:
    - company: "Google"
      treatment: "Extensive university AI research partnerships with major institutions globally"
    - company: "Novartis"
      treatment: "Multi-year research collaborations with universities for drug discovery"
    - company: "IBM"
      treatment: "Long-standing university research programs including quantum computing partnerships"
