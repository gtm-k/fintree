definition: Base salary for top executive officers.
example: 'A mid-cap company pays its CEO $950K, CFO $650K, COO $600K, and CTO $625K in base salaries, totaling $2.825M in executive salaries.'
normal_balance: DEBIT
sign_convention: '+1'
