  - base_salary
  - fixed_cost
  - proxy_disclosure
classification_notes: 'Base salary is the fixed component of executive pay. Disclosed in the proxy statement Summary Compensation Table. Salary alone is usually a small fraction of total comp for public company executives. Includes employer payroll taxes attributable to executive salaries.'
variance_drivers:
  tags: [headcount_driven, board_driven, largely_fixed]
  playbook:
    if_increased: '(1) new C-suite hires expanding the executive team, (2) annual merit increases approved by compensation committee, (3) promotions to executive level, (4) cost-of-living adjustments in high-cost markets'
    if_decreased: '(1) executive departures not backfilled, (2) voluntary salary reductions (e.g., during downturns), (3) consolidation of executive roles, (4) shift to lower-cost geographies'
comparability:
  variations: 'Base salaries are relatively comparable across industries for similar-sized companies. Tech companies often set lower base salaries offset by larger equity grants. Financial services and healthcare tend to have higher base salaries.'
  examples:
    - company: 'Microsoft'
      treatment: 'CEO base salary $2.5M; disclosed in proxy Summary Compensation Table; classified in G&A'
    - company: 'Walmart'
      treatment: 'CEO base salary $1.3M; retail executives have moderate base salaries with large bonus potential'
