formula_human: ''
formula_machine: ''
asc_reference: 'ASC 720'
definition: Ongoing maintenance, cleaning, and facility management for corporate offices.
example: 'A corporate office pays $144K/year for maintenance: $84K janitorial services (3x/week cleaning), $36K HVAC maintenance contract, $24K miscellaneous repairs (plumbing, electrical).'
normal_balance: DEBIT
sign_convention: '+1'
industry_variants:
- manufacturing
- saas
- retail
- financial_services
- professional_services
is_leaf: true
is_decision_node: false
