  - maintenance
  - janitorial
  - facilities
  - contract_services
classification_notes: 'Includes janitorial/cleaning services, minor plumbing/electrical repairs, HVAC servicing, pest control, landscaping, and security services. Capital improvements (new HVAC system, roof replacement) should be capitalized under ASC 360, not expensed here. Manufacturing facility maintenance is under manufacturing overhead, not G&A.'
variance_drivers:
  tags: [contract_driven, square_footage_driven, largely_fixed]
  playbook:
    if_increased: '(1) aging building requiring more frequent repairs, (2) enhanced cleaning protocols (post-COVID), (3) office expansion increasing square footage, (4) vendor price increases on service contracts, (5) adding new services (security, concierge)'
    if_decreased: '(1) office downsizing reducing maintained square footage, (2) renegotiated cleaning and maintenance contracts, (3) reduced cleaning frequency for hybrid offices, (4) newer building requiring less maintenance, (5) bringing janitorial services in-house'
comparability:
  variations: 'Gross lease tenants may have maintenance included in rent (showing $0 here). NNN lease tenants pay all maintenance directly. Typical office maintenance is $3-8/sq ft/year depending on building class and services. Some companies combine this with office supplies into a single occupancy line.'
  examples:
    - company: 'WeWork (member company)'
      treatment: 'Maintenance included in WeWork membership fee; shows $0 in this line'
    - company: 'Large corporate campus (owned)'
      treatment: 'Full maintenance budget managed internally; includes landscaping, security, cleaning'
