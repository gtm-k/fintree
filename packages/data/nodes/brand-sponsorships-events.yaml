asc_reference: 'ASC 720-35'
definition: Sponsorship of events, conferences, or organizations for brand visibility.
example: 'A fintech company pays $250K to sponsor a major industry conference (keynote naming rights), $100K for a local tech meetup series sponsorship, and $50K for a charity gala presenting sponsorship, totaling $400K in brand sponsorships.'
normal_balance: DEBIT
sign_convention: '+1'
