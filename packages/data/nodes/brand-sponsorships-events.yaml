  - brand_building
  - opex
  - discretionary
  - events
classification_notes: 'Sponsorship costs are expensed as incurred or over the sponsorship period. Multi-year sponsorship agreements should be expensed ratably. If the sponsorship includes tangible benefits (booth space, attendee lists), it is an advertising expense; if purely charitable with no benefit, it may be a charitable contribution. Sports stadium naming rights are typically amortized over the contract term. Distinguish from trade show costs — sponsorships are for brand visibility, not direct lead generation.'
variance_drivers:
  tags: [discretionary, contract_driven, brand_investment]
  playbook:
    if_increased: '(1) new multi-year sponsorship deal signed (stadium, conference series), (2) expansion into new markets requiring brand awareness investment, (3) competitive sponsorship escalation in key industry events, (4) IPO or public debut requiring brand visibility, (5) sponsoring major events in a given year (Olympics, World Cup cycles)'
    if_decreased: '(1) exiting sponsorship agreements at renewal, (2) budget cuts reducing discretionary brand spend, (3) shift from event sponsorships to digital brand campaigns, (4) event cancellations or format changes, (5) renegotiating sponsorship terms at lower rates'
comparability:
  variations: 'Sponsorship costs are rarely disclosed separately in public filings. Companies with major naming rights deals (stadiums, arenas) may disclose the total commitment in contractual obligations. B2B companies sponsor industry conferences; consumer brands sponsor sports and entertainment. Some companies classify sponsorships under advertising; others under general marketing or even G&A.'
  examples:
    - company: 'Red Bull'
      treatment: 'Massive sponsorship spending (F1, extreme sports) embedded in marketing costs; core to brand identity'
    - company: 'Salesforce'
      treatment: 'Major conference sponsor (Dreamforce own event + industry events); included in Marketing and Sales'
    - company: 'Coca-Cola'
      treatment: 'Olympic and FIFA sponsor; multi-year commitments disclosed in contractual obligations; classified in SG&A'
