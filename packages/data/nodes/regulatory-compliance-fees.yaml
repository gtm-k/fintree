classification_notes: 'Includes SEC filing fees, stock exchange listing fees, state corporation fees, industry-specific licensing fees, and compliance consulting. Financial services firms pay significant regulatory fees to FINRA, OCC, FDIC, and state regulators. GDPR, HIPAA, and SOX compliance consulting fees belong here. Regulatory fines and penalties should be disclosed separately and may not be tax-deductible.'
variance_drivers:
  tags: [regulatory_driven, compliance_driven, industry_driven, event_driven]
  playbook:
    if_increased: '(1) new regulatory requirements (GDPR, CCPA, AI regulations), (2) IPO creating SEC and exchange listing fees, (3) expansion into regulated industries or markets, (4) increased compliance consulting for new mandates, (5) government fee increases'
    if_decreased: '(1) deregistration from SEC reporting, (2) regulatory simplification, (3) bringing compliance expertise in-house, (4) delisting from a stock exchange, (5) exiting regulated business lines'
comparability:
  variations: 'Financial services and healthcare companies face the highest regulatory costs (FDIC assessments, OCC fees, HIPAA compliance). Tech companies face increasing regulatory scrutiny (privacy, AI, antitrust). SEC filing fees are based on aggregate offering amount. Stock exchange listing fees are based on shares outstanding.'
  examples:
    - company: 'Bank of America'
      treatment: 'FDIC insurance assessments and OCC fees are significant regulatory costs within noninterest expense'
    - company: 'Pfizer'
      treatment: 'FDA regulatory compliance costs (clinical trial oversight, drug safety reporting) embedded in G&A and R&D'
