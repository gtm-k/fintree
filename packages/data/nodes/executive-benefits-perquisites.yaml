classification_notes: 'Perquisites exceeding $10K per item for NEOs must be disclosed individually in proxy statement per SEC rules. Common perks include personal security, company aircraft use, car allowances, housing allowances, financial planning, supplemental insurance, and club memberships. Relocation packages for new executives are also classified here.'
variance_drivers:
  tags: [headcount_driven, policy_driven, board_driven]
  playbook:
    if_increased: '(1) new executive hires with relocation packages, (2) enhanced security requirements for executives, (3) board approval of new perquisite programs, (4) increased personal use of company aircraft, (5) supplemental retirement plan contributions'
    if_decreased: '(1) elimination of perquisite programs to improve optics, (2) executive departures, (3) policy changes restricting personal aircraft use, (4) industry trend toward reducing disclosed perquisites'
comparability:
  variations: 'Perquisite levels vary significantly by industry and company size. Financial services and energy companies tend to offer more perks. Tech companies increasingly minimize disclosed perquisites. SEC requires itemized disclosure in proxy for NEOs above $10K thresholds.'
  examples:
    - company: 'Oracle'
      treatment: 'CEO perquisites include personal security, personal use of company aircraft; disclosed in proxy All Other Compensation column'
    - company: 'Berkshire Hathaway'
      treatment: 'Minimal executive perquisites; CEO famously takes $100K salary with minimal additional benefits'
