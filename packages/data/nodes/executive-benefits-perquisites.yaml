definition: Benefits specific to executive roles (supplemental insurance, car allowances,
  housing, etc.).
example: 'A CEO receives $150K in perquisites including $60K personal security, $40K car allowance, $30K supplemental life insurance, and $20K financial planning services.'
normal_balance: DEBIT
sign_convention: '+1'
