id: "fintree:Cogs"
xbrl_tag: "us-gaap:CostOfGoodsAndServicesSold"
label: "Cost of Goods Sold"
short_label: "COGS"
level: 1
node_type: GAAP_SUBTOTAL
parent_id: "fintree:GrossProfit"
aggregation_type: SUM
formula_human: "Direct Materials + Direct Labor + Manufacturing Overhead + Other Direct Costs"
formula_machine: "fintree:DirectMaterials + fintree:DirectLabor + fintree:ManufacturingOverhead + fintree:OtherDirectCosts"
asc_reference: "ASC 330"
definition: "The aggregate cost of goods produced and sold, and services rendered during the reporting period. Includes all direct costs attributable to the production of goods or delivery of services — materials, labor, and allocated overhead."
example: "A manufacturer with $40M in raw materials, $15M direct labor, and $10M factory overhead reports $65M COGS against $100M revenue for a 35% gross margin."
normal_balance: DEBIT
sign_convention: "+1"
industry_variants: [manufacturing, saas, retail, financial_services, professional_services]
is_leaf: false
is_decision_node: false
is_non_gaap: false
below_the_line: false
non_recurring: false
ai_context_tags:
  - direct_costs
  - cost_of_revenue
  - gross_margin_driver
  - gaap_required
  - above_gross_profit
classification_notes: "In SaaS companies, COGS is often labeled 'Cost of Revenue' and includes hosting costs, customer support, and amortization of capitalized software. In professional services, it includes billable labor and direct project costs."
variance_drivers:
  tags: [volume_driven, input_cost_driven, mix_driven, efficiency_driven]
  playbook:
    if_increased: "(1) higher sales volume driving proportional cost increase, (2) raw material or input cost inflation, (3) supply chain disruptions increasing procurement costs, (4) unfavorable product mix shift toward lower-margin products, (5) manufacturing inefficiency or yield loss"
    if_decreased: "(1) lower sales volume, (2) favorable input cost trends or renegotiated supplier contracts, (3) manufacturing efficiency gains or automation, (4) favorable product mix shift, (5) outsourcing or offshoring production"
comparability:
  variations: "Terminology varies significantly by industry: 'Cost of Revenue' (tech/SaaS), 'Cost of Goods Sold' (manufacturing/retail), 'Cost of Services' (professional services). Some companies include D&A in COGS; others report it separately."
  examples:
    - company: "Apple"
      treatment: "Cost of sales (products + services)"
    - company: "Salesforce"
      treatment: "Cost of revenues (subscription + professional services)"
    - company: "Walmart"
      treatment: "Cost of sales"
    - company: "Goldman Sachs"
      treatment: "Not applicable — uses interest expense and provisions"
coa_mapping:
  quickbooks: "5000 - Cost of Goods Sold"
  netsuite: "5000 - COGS"
  sap: "5000000 - Cost of Goods Sold"
