  - asc_740
classification_notes: 'The 21% flat corporate rate was established by the Tax Cuts and Jobs Act (TCJA) in 2017, down from 35%. Federal current tax is computed on US taxable income, which differs from book income due to permanent differences (meals deduction limits, municipal bond interest exclusion) and timing differences. R&D credits (IRC Section 41), foreign tax credits, and other tax incentives reduce the federal tax below the statutory rate. Companies with significant NOL carryforwards may show zero or negative federal current tax.'
variance_drivers:
  tags: [domestic_taxable_income, tax_credits, statutory_rate, nol_utilization]
  playbook:
    if_increased: '(1) higher US domestic pre-tax income, (2) expiration or reduction of R&D or other tax credits, (3) statutory rate increase by Congress, (4) fewer permanent deductions in current year, (5) full utilization of prior NOL carryforwards'
    if_decreased: '(1) lower US domestic pre-tax income, (2) R&D tax credits and other credit incentives, (3) NOL carryforward utilization offsetting current income, (4) income shifting to foreign jurisdictions, (5) increased tax-exempt income (municipal bonds)'
comparability:
  variations: 'All US corporations face the same 21% statutory rate. Effective rates differ due to credits, deductions, and permanent differences. Companies with significant R&D (tech, pharma) often have lower effective federal rates. Companies with mostly domestic operations have larger federal tax relative to total tax.'
  examples:
    - company: 'Walmart'
      treatment: 'Federal current tax — large domestic component reflecting US-centric operations'
    - company: 'Tesla'
      treatment: 'Federal current tax reduced by energy-related credits and stock option deductions'
    - company: 'Pfizer'
      treatment: 'Federal current tax — R&D credits and foreign income exclusions lower effective rate'
coa_mapping:
