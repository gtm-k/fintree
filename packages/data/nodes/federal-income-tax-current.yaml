definition: US federal corporate income tax due for the current year (21% flat rate
  for corporations as of 2026).
example: 'A domestic manufacturer with $50M in US taxable income records $10.5M in federal current tax expense at the 21% statutory rate, reduced to $8.9M after $1.6M in R&D tax credits.'
