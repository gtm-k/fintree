classification_notes: General liability and property insurance specific to production
  facilities is Manufacturing Overhead; this is corporate-level insurance. D&O insurance is essential for public companies to attract board members. Premiums are prepaid and amortized over the policy period. Claims-made vs. occurrence policies affect timing of expense recognition. Side-A, B, and C D&O coverage serve different purposes.
variance_drivers:
  tags: [market_driven, risk_driven, claims_driven, largely_fixed]
  playbook:
    if_increased: '(1) IPO dramatically increasing D&O premiums, (2) securities litigation or SEC investigation driving rate increases, (3) hard insurance market with rising premiums industry-wide, (4) adding new coverage lines (cyber liability, EPL), (5) increased limits of liability requested by board'
    if_decreased: '(1) claims-free history earning premium reductions, (2) soft insurance market with competitive pricing, (3) higher retention/deductible levels to reduce premiums, (4) going private reducing D&O exposure, (5) forming a captive insurance subsidiary'
comparability:
  variations: 'D&O premiums vary enormously: $50K-$100K for private companies, $200K-$5M+ for public companies. Post-IPO companies and companies in litigation-prone industries pay the highest rates. D&O pricing is cyclical — premiums spiked 200-300% in 2020-2021, then moderated. Cyber insurance has become a significant new cost category.'
  examples:
    - company: 'Pre-IPO startup'
      treatment: 'D&O premium $30K-$80K; increases 5-10x upon IPO'
    - company: 'Large-cap public company'
      treatment: 'D&O tower of $100M+ in coverage with $1-3M annual premium; disclosed in proxy as director compensation'
