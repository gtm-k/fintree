definition: Performance bonuses for R&D staff tied to innovation milestones.
example: "A tech company pays $3.2M in annual bonuses to R&D staff: $1.5M in milestone bonuses for shipping a new product and $1.7M in annual performance bonuses."
normal_balance: DEBIT
sign_convention: '+1'
