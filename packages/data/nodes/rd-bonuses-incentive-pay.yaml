classification_notes: "Includes annual performance bonuses, project milestone bonuses, signing bonuses, and retention bonuses for R&D employees. Stock-based compensation (RSUs, options) may be classified here or in a separate SBC line. Accrual timing can create quarter-to-quarter variability."
variance_drivers:
  tags: [performance_driven, seasonal, discretionary]
  playbook:
    if_increased: "(1) strong product launch triggering milestone bonuses, (2) increased target bonus percentages to retain talent, (3) signing and retention bonuses in competitive hiring market, (4) company-wide performance exceeding targets"
    if_decreased: "(1) company underperformance reducing bonus pools, (2) R&D headcount reductions, (3) shift from cash bonuses to equity compensation, (4) project cancellations eliminating milestone payouts"
comparability:
  variations: "Tech companies often emphasize equity (RSUs, options) over cash bonuses. Pharma companies may tie bonuses to clinical trial milestones. Bonus as a percentage of base salary typically ranges from 10-30% for R&D roles."
  examples:
    - company: "Netflix"
      treatment: "Favors higher base salary over bonuses; minimal R&D bonus component"
    - company: "Pfizer"
      treatment: "R&D bonuses tied to pipeline milestones and clinical trial progress"
    - company: "Tesla"
      treatment: "R&D incentive pay includes significant equity component tied to performance milestones"
