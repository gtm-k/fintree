  - asc_740
classification_notes: 'Catch-all for deferred tax items not related to NOLs or depreciation timing. Common sources: (1) deferred revenue — taxed on receipt but deferred for book (DTA), (2) stock-based compensation — booked before tax deduction (DTA), (3) warranty and litigation reserves — accrued for book but deducted for tax only when paid (DTA), (4) pension obligations — different measurement timing (DTA or DTL), (5) unrealized gains on investments — recognized for book but not tax (DTL). The SBC deduction at exercise often exceeds book expense, creating windfall tax benefits.'
variance_drivers:
  tags: [revenue_timing, sbc_deductions, reserve_accruals, pension_obligations]
  playbook:
    if_increased: '(1) growing deferred revenue balances from subscription business growth, (2) increasing stock compensation expense creating larger DTAs, (3) higher warranty or litigation reserve accruals, (4) pension liability increases from actuarial assumption changes, (5) new temporary differences from acquisitions'
    if_decreased: '(1) recognition of previously deferred revenue reducing the DTA, (2) stock option exercises creating tax deductions that reduce the SBC DTA, (3) warranty claims paid reducing the reserve and associated DTA, (4) pension plan contributions or assumption changes reducing obligations, (5) tax rate changes re-measuring deferred tax balances'
comparability:
  variations: 'The composition of other deferred tax items varies significantly by industry. SaaS/subscription companies have large deferred revenue DTAs. Tech companies have significant SBC-related DTAs. Manufacturing companies have warranty reserve DTAs. The deferred tax footnote is essential for understanding the company-specific mix.'
  examples:
    - company: 'Microsoft'
      treatment: 'Large DTA from deferred revenue (multi-year licenses) and stock compensation'
    - company: 'Boeing'
      treatment: 'Significant DTAs from warranty reserves, pension obligations, and long-term contract timing'
    - company: 'Netflix'
      treatment: 'DTA from content amortization timing differences and stock compensation'
