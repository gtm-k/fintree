asc_reference: 'ASC 740-10'
definition: Deferred taxes from revenue recognition timing, stock compensation, warranty
  reserves, and other temporary differences.
example: 'A SaaS company with $150M in deferred revenue (taxed on cash receipt but recognized over time for GAAP) holds a $31.5M deferred tax asset. Separately, $80M in stock compensation expense (book, not yet tax-deductible) creates a $16.8M DTA.'
normal_balance: DEBIT
sign_convention: '+1'
