definition: State and local corporate income taxes due for the current period. Rates
  vary by jurisdiction.
example: 'A California-headquartered SaaS company with $80M in apportioned state taxable income pays $7.2M in state income taxes (California at 8.84%), plus $1.8M across other states where it has nexus.'
