id: fintree:SupportStaffWagesSalary
xbrl_tag: us-gaap:CostOfGoodsAndServicesSold
label: Support Staff Wages & Salary
short_label: Support Staff Wages & Salary
level: 4
node_type: LINE_ITEM
parent_id: fintree:CustomerSupportLabor
aggregation_type: LEAF
formula_human: ''
asc_reference: ''
definition: Gross compensation for customer support representatives in COGS.
example: A SaaS company pays $3.2M/year in salaries for its 50-person customer support
  team (Tier 1-3), classified as cost of revenue.
normal_balance: DEBIT
sign_convention: '+1'
industry_variants:
- manufacturing
- saas
- retail
- financial_services
- professional_services
is_leaf: true
is_decision_node: false
is_non_gaap: false
below_the_line: false
non_recurring: false
ai_context_tags:
  - customer support
  - support salaries
  - COGS labor
  - help desk
  - technical support
  - cost of revenue
classification_notes: Includes base salary, overtime, and shift differentials for customer
  support staff classified in COGS. Some companies classify support under S&M or G&A
  rather than COGS, affecting gross margin comparability. Outsourced support (BPO)
  costs are not wages and belong in a separate line item.
variance_drivers:
  tags:
    - headcount
    - salary levels
    - outsourcing mix
  playbook:
    if_increased: |-
      1. Expanded support team to handle growing customer base
      2. Annual salary increases or cost-of-living adjustments
      3. Brought outsourced support roles in-house for quality control
      4. Added premium/enterprise support tier requiring specialized staff
      5. Increased overtime due to higher support ticket volume
    if_decreased: |-
      1. Outsourced support to lower-cost BPO providers
      2. Implemented AI chatbots and self-service reducing headcount needs
      3. Support staff reductions through layoffs or attrition
      4. Reclassified support staff from COGS to G&A or S&M
comparability:
  variations: The classification of customer support as COGS vs. OpEx significantly
    affects gross margin comparability. Companies with offshore support teams report
    lower per-head costs. BPO-heavy models show support costs as professional services
    expense rather than wages.
  examples:
    - company: Salesforce
      treatment: Classifies customer success and support staff wages within cost of
        subscription and support revenue
    - company: Twilio
      treatment: Includes support team salaries within cost of revenue alongside
        infrastructure costs
    - company: Intercom
      treatment: Reports support staff wages in cost of revenue, emphasizing the
        direct connection between support delivery and service quality
coa_mapping:
  quickbooks: '5100 - Support Staff Wages & Salary'
  netsuite: '5100 - Customer Support Wages'
  sap: '4100100 - Support Staff Wages and Salary'
