label: ADVERTISING & MARKETING
short_label: ADVERTISING & MARKETING
level: 3
node_type: SUB_CATEGORY
parent_id: fintree:SellingExpenses
aggregation_type: SUM
formula_human: 'Digital Advertising + Content Marketing & SEO + Marketing Software & Tools + Marketing Agency Fees + Traditional / Offline Advertising + Brand Sponsorships & Events'
formula_machine: 'fintree:DigitalAdvertising + fintree:ContentMarketingSeo + fintree:MarketingSoftwareTools + fintree:MarketingAgencyFees + fintree:TraditionalOfflineAdvertising + fintree:BrandSponsorshipsEvents'
asc_reference: 'ASC 720-35'
definition: Paid media and brand-building expenditures designed to generate demand.
example: 'A DTC e-commerce company spends $5M on digital ads (Google/Meta), $1.2M on content and SEO, $800K on marketing tools (HubSpot, Mixpanel), $600K on agency fees, $2M on TV/print, and $400K on sponsorships, totaling $10M in advertising and marketing.'
normal_balance: DEBIT
sign_convention: '+1'
industry_variants:
- manufacturing
- saas
- retail
- financial_services
- professional_services
is_leaf: false
is_decision_node: false
is_non_gaap: false
below_the_line: false
non_recurring: false
