  - packaging
  - shipping
  - logistics
  - fulfillment
classification_notes: 'Secondary packaging protects the product during storage and transit but is not part of the consumer-facing product. Some companies classify shipping packaging as a selling expense or fulfillment cost rather than COGS — the classification depends on accounting policy election. Under ASC 606, shipping and handling can be treated as a fulfillment activity (COGS) or a separate performance obligation.'
variance_drivers:
  tags: [commodity_driven, volume_driven, fulfillment_driven]
  playbook:
    if_increased: '(1) Corrugated paperboard price increases, (2) higher order volumes especially in e-commerce, (3) more protective packaging required for fragile products, (4) sustainability mandates requiring costlier materials, (5) smaller average order sizes requiring more boxes per unit'
    if_decreased: '(1) Right-sizing packaging to reduce material waste, (2) lower paperboard prices, (3) reusable packaging programs, (4) bulk shipments reducing per-unit packaging, (5) supplier consolidation and volume discounts'
comparability:
  variations: 'E-commerce companies have high secondary packaging costs. B2B industrial companies shipping in bulk have minimal secondary packaging. Some companies include secondary packaging in fulfillment or selling expenses rather than COGS.'
  examples:
    - company: 'Amazon'
      treatment: 'Reports shipping boxes and mailers as a major fulfillment cost; investing in frustration-free packaging to reduce waste'
    - company: 'Costco'
      treatment: 'Minimal secondary packaging; products often sold on original pallets or in shelf-ready cases'
    - company: 'Wayfair'
      treatment: 'Reports significant secondary packaging costs for large furniture items requiring custom crating'
coa_mapping:
