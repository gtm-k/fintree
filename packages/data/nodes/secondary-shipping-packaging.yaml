definition: Outer packaging for shipping (corrugated boxes, pallets, shrink wrap).
example: 'An e-commerce retailer spends $4M on corrugated shipping boxes, $1M on bubble wrap and void fill, and $500K on stretch wrap and pallets for outbound shipments.'
normal_balance: DEBIT
sign_convention: '+1'
industry_variants:
