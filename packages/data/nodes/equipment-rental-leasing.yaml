id: fintree:EquipmentRentalLeasing
xbrl_tag: us-gaap:OperatingLeaseExpense
label: Equipment Rental / Leasing
short_label: Equipment Rental / Leasing
level: 4
node_type: LINE_ITEM
parent_id: fintree:EquipmentDepreciation
aggregation_type: LEAF
formula_human: ''
asc_reference: ''
definition: Lease payments on production equipment (operating lease treatment per
  ASC 842).
example: A food manufacturer leases packaging equipment for $8K/month under a 3-year
  operating lease and rents specialized mixing equipment for $3K/month on a short-term
  rental agreement.
normal_balance: DEBIT
sign_convention: '+1'
industry_variants:
- manufacturing
- saas
- retail
- financial_services
- professional_services
is_leaf: true
is_decision_node: false
is_non_gaap: false
below_the_line: false
non_recurring: false
ai_context_tags:
  - equipment lease
  - operating lease
  - rental expense
  - ASC 842
  - production equipment
  - right-of-use asset
classification_notes: Under ASC 842, most leases create a right-of-use asset and lease
  liability on the balance sheet. Operating leases recognize straight-line expense;
  finance leases split into depreciation and interest. Short-term leases (under 12
  months) can use the practical expedient and expense as incurred. Distinguish from
  owned equipment depreciation.
variance_drivers:
  tags:
    - lease terms
    - capacity needs
    - buy-vs-lease decisions
  playbook:
    if_increased: |-
      1. New equipment leases to expand production capacity
      2. Strategic shift from buying to leasing to preserve capital
      3. Lease renewal at higher market rates
      4. Short-term equipment rentals for project-based production
    if_decreased: |-
      1. Purchasing previously leased equipment at lease end
      2. Lease expirations not renewed due to capacity reduction
      3. Renegotiated lease terms at lower rates
      4. Equipment returned as production lines are consolidated
comparability:
  variations: ASC 842 adoption made most leases visible on the balance sheet, but
    presentation of expense varies. Some companies show lease expense in a dedicated
    line; others embed it in depreciation or occupancy costs. Finance leases create
    depreciation plus interest, complicating comparisons with operating leases.
  examples:
    - company: United Rentals
      treatment: As a lessor, discloses equipment rental revenue; as a lessee, reports
        fleet-related leases within cost of revenues
    - company: Boeing
      treatment: Reports production equipment leases within cost of products, with
        ASC 842 disclosures in notes
    - company: 3M
      treatment: Includes equipment lease costs within manufacturing overhead allocated
        to cost of sales
coa_mapping:
  quickbooks: '5075 - Equipment Rental / Leasing'
  netsuite: '5075 - Equipment Rental Leasing'
  sap: '0050750 - Equipment Rental Leasing'
