classification_notes: "Professional services revenue is recognized based on the pattern of transfer: time-and-materials contracts use an input method (hours incurred), while fixed-price contracts typically use an output method or percentage-of-completion. In SaaS companies, professional services are often sold below cost as an enabler for subscription revenue."
variance_drivers:
  tags: [volume_driven, pricing_driven, mix_driven, seasonal]
  playbook:
    if_increased: "(1) new implementation projects from product launches, (2) higher billing rates, (3) increased headcount enabling more delivery capacity, (4) large digital transformation engagements, (5) higher utilization rates"
    if_decreased: "(1) project delays or cancellations, (2) lower utilization rates (bench time), (3) pricing pressure from offshore competitors, (4) customer shift to self-implementation or partner-led delivery, (5) seasonal slowdowns in Q1 or summer months"
comparability:
  variations: "Pure-play consulting firms report this as their primary revenue. SaaS companies typically report professional services as a separate, lower-margin revenue line. Some companies combine implementation and training revenue."
  examples:
    - company: "Accenture"
      treatment: "Consulting revenue and Managed Services revenue"
    - company: "Workday"
      treatment: "Professional services revenue (separate from subscription)"
    - company: "Deloitte"
      treatment: "Consulting and Advisory revenue"
coa_mapping:
