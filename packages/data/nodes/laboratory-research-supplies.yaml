  - reagents
  - asc_730
classification_notes: "Includes consumable items such as chemicals, reagents, cell cultures, assay kits, glassware, and disposable lab equipment. Must be expensed as incurred if no alternative future use. If lab supplies have alternative future use (e.g., can be used in production), capitalize as inventory until consumed."
variance_drivers:
  tags: [project_driven, volume_driven, seasonal]
  playbook:
    if_increased: "(1) new drug candidates entering preclinical testing, (2) expanded testing protocols, (3) supply cost inflation for specialty chemicals, (4) new lab facility opening"
    if_decreased: "(1) project completions or cancellations, (2) lab closures, (3) negotiated volume discounts with suppliers, (4) shift to computational/in-silico research methods"
comparability:
  variations: "Pharma and biotech companies have the highest lab supply costs. Hardware companies include testing components. Pure software companies have minimal to zero lab supplies."
  examples:
    - company: "Abbott Laboratories"
      treatment: "Significant lab supply costs for diagnostic and pharmaceutical R&D"
    - company: "Thermo Fisher"
      treatment: "Lab supplies for internal R&D, also a major supplier to other companies"
    - company: "Regeneron"
      treatment: "Lab materials including biological reagents and cell culture media for antibody research"
