classification_notes: 'Regular production wages are the straight-time (non-overtime) gross pay for workers directly involved in manufacturing. Excludes overtime premium (separate line item), employer payroll taxes, and benefits. In standard costing, this creates the basis for labor rate and efficiency variances. Includes both hourly and salaried production workers during their standard work hours.'
variance_drivers:
  tags: [rate_driven, headcount_driven, volume_driven]
  playbook:
    if_increased: '(1) Annual wage rate increases or cost-of-living adjustments, (2) additional production headcount hired, (3) minimum wage legislation increases, (4) union contract wage escalators, (5) shift from contract to permanent employees'
    if_decreased: '(1) Automation reducing required production headcount, (2) lean manufacturing reducing labor hours per unit, (3) attrition not replaced during demand downturn, (4) shift to lower-cost production facility, (5) increased use of temporary staffing'
comparability:
  variations: 'Wage rates vary dramatically by geography: US average manufacturing wage ~$25/hr vs. China ~$6/hr vs. Vietnam ~$3/hr. Union vs. non-union wage differentials can be 20-40%. Some companies include regular wages and overtime in a single line.'
  examples:
    - company: 'Toyota (US)'
      treatment: 'Reports regular hourly wages for non-union US assembly workers at ~$30/hr; competitive with UAW rates'
    - company: 'Foxconn'
      treatment: 'Reports regular wages for assembly workers in China at approximately $3-5/hr; largest cost category'
    - company: 'Deere & Company'
      treatment: 'Reports UAW-negotiated hourly wages for production workers; includes skilled trades at higher rates'
coa_mapping:
