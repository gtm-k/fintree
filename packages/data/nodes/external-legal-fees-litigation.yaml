definition: Fees for defending or prosecuting lawsuits (disclosed separately if material
  per Reg S-X).
example: 'A company defending a patent infringement lawsuit pays $2.1M in litigation fees: $1.5M to lead litigation counsel, $400K expert witnesses and discovery, $200K e-discovery and document review.'
normal_balance: DEBIT
sign_convention: '+1'
industry_variants:
- manufacturing
- saas
- retail
- financial_services
- professional_services
is_leaf: true
is_decision_node: false
is_non_gaap: false
below_the_line: false
