below_the_line: false
non_recurring: false
ai_context_tags:
  - interest_income
  - investment_income
  - cash_yield
  - non_operating
  - interest_rate_sensitive
  - treasury_management
classification_notes: 'Non-operating for most companies. For banks and financial institutions, interest income is an operating item and the primary revenue source. Includes interest on bank deposits, money market funds, Treasury bills, corporate bonds, and other fixed income securities. Accrue using effective interest method per ASC 835-30.'
variance_drivers:
  tags: [interest_rate_driven, cash_balance_driven, portfolio_mix]
  playbook:
    if_increased: '(1) rising interest rates increasing yield on cash and investments, (2) larger cash/investment balances, (3) shift to higher-yielding fixed income securities, (4) proceeds from equity raise or asset sale parked in interest-bearing accounts'
    if_decreased: '(1) falling interest rates reducing yield, (2) lower cash balances from capex or M&A spending, (3) shift to lower-yielding or equity investments, (4) debt repayment reducing investable cash'
comparability:
  variations: 'Banks report interest income as a primary operating revenue line. Non-financial companies report it as non-operating. Some companies net interest income against interest expense into a single line.'
  examples:
    - company: 'Apple'
      treatment: 'Interest income shown within Other income/(expense), net footnote detail'
    - company: 'JPMorgan Chase'
      treatment: 'Interest income — primary operating revenue line ($89B in 2023)'
    - company: 'Alphabet'
      treatment: 'Interest income reported separately within Other income (expense)'
