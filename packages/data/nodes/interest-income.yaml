formula_human: ''
formula_machine: ''
asc_reference: 'ASC 835-30'
definition: Interest earned on cash deposits, money market funds, and fixed income
  investments.
example: 'Apple earned $3.7B in interest income in FY2023 from its $166B cash and marketable securities portfolio, benefiting from rising interest rates.'
normal_balance: CREDIT
sign_convention: '+1'
industry_variants:
- manufacturing
