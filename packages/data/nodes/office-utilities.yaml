below_the_line: false
non_recurring: false
ai_context_tags:
  - ga_expense
  - office
  - utilities
  - occupancy
  - semi_variable
classification_notes: 'Office utilities are G&A; manufacturing plant utilities are manufacturing overhead (COGS). In multi-use facilities, utilities should be allocated between production and corporate use. Gross leases often include utilities in the rent; net leases require separate utility payments. Internet and phone service may be classified here or under IT depending on company policy.'
variance_drivers:
  tags: [usage_driven, rate_driven, seasonal, semi_variable]
  playbook:
    if_increased: '(1) energy rate increases, (2) office expansion increasing square footage, (3) return-to-office increasing occupancy and usage, (4) extreme weather driving HVAC costs, (5) adding energy-intensive equipment (server rooms, EV charging stations)'
    if_decreased: '(1) reduced office occupancy from hybrid work, (2) energy efficiency improvements (LED lighting, smart HVAC), (3) solar panel installations reducing grid electricity costs, (4) office downsizing, (5) utility rate negotiations or switching providers'
comparability:
  variations: 'Utilities per sq ft vary by climate, building age, and energy efficiency. Gross lease tenants show zero utility expense (included in rent). Net lease tenants show full utility costs. Companies with on-site data centers will have significantly higher electricity costs classified under IT rather than office utilities.'
  examples:
    - company: 'Apple (Apple Park)'
      treatment: '100% renewable energy campus; low utility costs relative to building size'
    - company: 'Traditional office tenant'
      treatment: 'Utilities paid separately under NNN lease; typically $2-4/sq ft/year'
coa_mapping:
