formula_machine: ''
asc_reference: 'ASC 720'
definition: Electricity, HVAC, water, and other utilities for corporate offices.
example: 'A 40,000 sq ft corporate office in Chicago pays $96K/year in utilities: $60K electricity, $18K natural gas (heating), $12K water/sewer, $6K trash removal.'
normal_balance: DEBIT
sign_convention: '+1'
industry_variants:
- manufacturing
- saas
- retail
- financial_services
- professional_services
is_leaf: true
is_decision_node: false
