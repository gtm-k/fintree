formula_human: ''
formula_machine: ''
asc_reference: 'ASC 321-10'
definition: Mark-to-market gains or realized gains from equity investments.
example: 'Berkshire Hathaway reported $35.5B in investment gains in FY2023, driven primarily by unrealized appreciation in its Apple and other equity holdings under ASC 321.'
normal_balance: CREDIT
sign_convention: '+1'
industry_variants:
