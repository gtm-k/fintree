below_the_line: false
non_recurring: false
ai_context_tags:
  - investment_gains
  - mark_to_market
  - realized_gains
  - unrealized_gains
  - equity_securities
  - asc_321
classification_notes: 'Under ASC 321 (post-ASU 2016-01), equity securities with readily determinable fair values are marked to market through the income statement — creating potentially large, volatile gains/losses that do not represent cash flow. Realized gains occur on actual sale. Analysts often exclude unrealized gains from recurring earnings. Debt securities classified as available-for-sale record unrealized gains in OCI, not P&L.'
variance_drivers:
  tags: [market_driven, portfolio_composition, realized_vs_unrealized]
  playbook:
    if_increased: '(1) rising equity markets boosting unrealized gains on mark-to-market portfolio, (2) sale of appreciated investments at a gain, (3) new investments that appreciated quickly, (4) favorable sector rotation benefiting held positions'
    if_decreased: '(1) declining equity markets reducing mark-to-market values, (2) sale of investments at lower gains, (3) reduced investment portfolio size, (4) shift from equity to fixed-income investments with less price appreciation'
comparability:
  variations: 'Post-ASU 2016-01, all equity securities flow through P&L, creating massive volatility for large holders. Some companies present gains/losses net; others separate realized from unrealized. Many companies add non-GAAP adjustments to exclude unrealized gains.'
  examples:
    - company: 'Berkshire Hathaway'
      treatment: 'Investment gains/losses — enormous line item ($35B+) driven by Apple and equity portfolio mark-to-market'
    - company: 'SoftBank'
      treatment: 'Gain on investments — Vision Fund marks startup portfolio to fair value each quarter'
    - company: 'Alphabet'
      treatment: 'Gain on equity securities — includes gains/losses on venture investments'
coa_mapping:
  quickbooks: '7200 - Gain on Investments'
  netsuite: '7200 - Gain on Investments'
  sap: '7200000 - Gain on Investments'
