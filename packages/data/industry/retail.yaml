industry: retail
label: Retail & E-Commerce
description: >
  Overlay for companies that sell merchandise to consumers. Emphasizes inventory
  management, merchandise margins, store/fulfillment costs, and promotional
  discounts. Suppresses R&D and SaaS infrastructure nodes.

