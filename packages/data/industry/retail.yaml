notes: >
  Retail P&Ls focus on merchandise margin, same-store sales growth, and inventory
  turnover. Shrinkage and markdowns are critical cost drivers. E-commerce adds
  fulfillment and payment processing as major COGS components. Seasonality
  heavily influences quarterly comparisons.
