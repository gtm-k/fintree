notes: >
  Professional services firms are measured on utilization rate, revenue per
  employee, and realization rate (billed vs. standard hours). Personnel costs
  typically represent 60-75% of revenue. Hiring pace and attrition are leading
  indicators. Travel and subcontractor costs are the primary variable expenses.
