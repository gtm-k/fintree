industry: professional-services
label: Professional Services
description: >
  Overlay for consulting firms, law firms, accounting practices, staffing agencies,
  and other labor-intensive service businesses. Emphasizes personnel costs,
  utilization metrics, and project-based revenue. Suppresses manufacturing and
  inventory nodes.

