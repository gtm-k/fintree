notes: >
  SaaS P&Ls are evaluated on ARR/MRR growth, gross margin (target >70%), net
  revenue retention, and the Rule of 40 (growth rate + FCF margin). Cost of
  revenue is dominated by hosting and support, not physical goods. R&D and S&M
  typically represent the largest opex categories.
