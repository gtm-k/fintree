industry: saas
label: Software as a Service (SaaS)
description: >
  Overlay for subscription-based software companies. Emphasizes recurring revenue
  streams, cloud infrastructure costs, R&D headcount, and customer acquisition.
  Suppresses physical inventory and manufacturing nodes.

