industry: manufacturing
label: Manufacturing
description: >
  Overlay for companies that produce physical goods. Emphasizes COGS breakdown
  (raw materials, direct labor, factory overhead), inventory flow, and
  production-related depreciation. Suppresses software/SaaS-specific nodes.

modifications:
  emphasize:
    - fintree:CostOfGoodsSoldCostOfRevenue
    - fintree:DirectMaterials
    - fintree:PrimaryRawMaterial
    - fintree:SecondaryRawMaterials
    - fintree:PurchasedComponents
    - fintree:Subassemblies
    - fintree:OemComponents
    - fintree:DirectLabor
    - fintree:RegularProductionWages
    - fintree:ProductionOvertimePay
    - fintree:ProductionSupervisorsManagers
    - fintree:QualityControlPersonnel
    - fintree:ManufacturingOverhead
    - fintree:FactoryRentLease
    - fintree:FactoryUtilities
    - fintree:FactoryProductionSupplies
    - fintree:ProductionEquipmentDepreciation
    - fintree:MachineryEquipmentDepreciation
    - fintree:BeginningInventory
    - fintree:NetPurchases
    - fintree:EndingInventory
    - fintree:InventoryAdjustments
    - fintree:InventoryObsolescenceWritedown
    - fintree:InventoryShrinkageSpoilage
    - fintree:FreightinInboundShipping
    - fintree:PackagingMaterials
    - fintree:PrimaryPackaging
    - fintree:SecondaryShippingPackaging
    - fintree:InboundFreightCustoms
    - fintree:OutboundFreightShipping
    - fintree:ShippingDistribution
    - fintree:DistributionCenterCosts

  suppress:
    - fintree:SubscriptionRevenue
    - fintree:UsagebasedRevenue
    - fintree:CloudInfrastructureHosting
    - fintree:ComputeEc2VirtualMachines
    - fintree:StorageS3ObjectStorage
    - fintree:NetworkingCdn
    - fintree:RdCloudCompute
    - fintree:RdSoftwareDevelopmentTools
    - fintree:CapitalizedSoftwareAmortization
    - fintree:DevopsPlatformEngineering
    - fintree:DevopsSreWagesSalary
    - fintree:FreeTrialDemoCosts
    - fintree:ApiIntegrationFees
    - fintree:CustomerLoyaltyCredits

  rename:
    fintree:ProductRevenue: Product Sales Revenue
    fintree:ServiceRevenue: Warranty & Service Revenue

notes: >
  Manufacturing P&Ls center on the COGS waterfall: raw materials -> WIP -> finished
  goods. Inventory valuation method (FIFO/LIFO/weighted-average) significantly
  affects gross margin. Production variances (yield loss, scrap) are critical KPIs.
